version: "3.7"

services:

## --------------------------- SEUFLUXO FRONTEND --------------------------- ##

  seufluxo_front:
    image: ghcr.io/erik280/seufluxowhatsapp-main:latest

    networks:
      - network

    environment:
      - VITE_SUPABASE_URL=https://pamhgjhijftcnfbhjoyk.supabase.co
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_API_BASE_URL=https://apiseufluxowhatsapp.transformafuturo.com.br

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.seufluxo_front.rule=Host(`seufluxowhatsapp.transformafuturo.com.br`)
        - traefik.http.routers.seufluxo_front.entrypoints=websecure
        - traefik.http.routers.seufluxo_front.priority=1
        - traefik.http.routers.seufluxo_front.tls.certresolver=letsencryptresolver
        - traefik.http.routers.seufluxo_front.service=seufluxo_front
        - traefik.http.services.seufluxo_front.loadbalancer.server.port=80
        - traefik.http.services.seufluxo_front.loadbalancer.passHostHeader=1

## --------------------------- SEUFLUXO API (BACKEND) ---------------------- ##

  seufluxo_api:
    image: ghcr.io/erik280/seufluxowhatsapp-api:latest

    networks:
      - network

    environment:
      ## --- Supabase ---
      - SUPABASE_URL=https://pamhgjhijftcnfbhjoyk.supabase.co
      - SUPABASE_KEY=${SUPABASE_KEY}

      ## --- Evolution API ---
      - EVOLUTION_API_URL=https://evo.transformafuturo.com.br
      - EVOLUTION_API_GLOBAL_KEY=${EVOLUTION_API_GLOBAL_KEY}

      ## --- MinIO ---
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=whatsapp-storage
      - MINIO_SECURE=false

      ## --- CORS ---
      - CORS_ORIGINS=https://seufluxowhatsapp.transformafuturo.com.br,https://apiseufluxowhatsapp.transformafuturo.com.br

      ## --- App ---
      - APP_ENV=production
      - LOG_LEVEL=info

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.seufluxo_api.rule=Host(`apiseufluxowhatsapp.transformafuturo.com.br`)
        - traefik.http.routers.seufluxo_api.entrypoints=websecure
        - traefik.http.routers.seufluxo_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.seufluxo_api.service=seufluxo_api
        - traefik.http.services.seufluxo_api.loadbalancer.server.port=8000
        - traefik.http.services.seufluxo_api.loadbalancer.passHostHeader=1

## -------------------------------------------------------------------- ##

networks:
  network:
    external: true
    name: network
